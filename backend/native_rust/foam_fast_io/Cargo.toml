[package]
name = "foam_fast_io"
version = "0.1.0"
edition = "2021"
authors = ["CFDSolver Architecture Team"]
description = "High-speed zero-copy OpenFOAM polyMesh and field reader for CFDSolver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memmap2 = "0.9"
flate2 = "1.0"
byteorder = "1.5"
rayon = "1.10"

[features]
default = []
python = ["pyo3", "numpy"]

[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
optional = true

[dependencies.numpy]
version = "0.22"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
