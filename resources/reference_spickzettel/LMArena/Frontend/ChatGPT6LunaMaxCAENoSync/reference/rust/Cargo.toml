[package]
name = "flux-cfd-cockpit"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
egui = "0.27"
egui-wgpu = "0.27"
glam = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }