[package]
name = "aeroforge-cockpit"
version = "0.14.2"
edition = "2021"
description = "AEROFORGE CFD Cockpit — Stage 2 interactive authoring reference"
license = "Apache-2.0"

[lib]
name = "cockpit"
path = "src/lib.rs"

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
# Rendering stack — versions are aligned with eframe 0.29's wgpu backend.
eframe = { version = "0.29", default-features = false, features = ["wgpu", "persistence", "default_fonts"] }
egui = "0.29"
egui_plot = "0.29"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
rhai = { version = "1.19", features = ["sync", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
memmap2 = "0.9"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
