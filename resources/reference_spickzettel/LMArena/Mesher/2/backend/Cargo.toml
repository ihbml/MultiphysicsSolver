[package]
name = "fvm-sph-mesher"
version = "0.1.0"
edition = "2021"
description = "Rust core for the FVM / Eulerian-SPH mesher (geometry, meshing, particle relaxation, coupling operators, export)"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
delaunator = "1"
rayon = "1"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
